# Musike DEMO — music-demo.example.com (Ernani1234/musike deployment)
# Deploy: copy this file as docker-compose.yml into the instance folder
# (e.g. <deploy-dir>/musike-demo/) next to ytdlp-wrap.sh, then: docker compose up -d
# Changes vs the prod compose:
#  - service/container named musike-demo, host port 4181
#    (reverse proxy: music-demo.example.com -> 4181; old demo hostname
#    redirects 301 to the prod host)
services:
  musike-demo:
    image: ghcr.io/ernani1234/musike:latest
    container_name: musike-demo
    ports:
      - "127.0.0.1:4181:4180"
    volumes:
      - musike-data:/data
      - musike-cache:/cache
      - ./ytdlp-wrap.sh:/data/ytdlp-wrap.sh:ro
    environment:
      MUSIKE_DATA_DIR: /data
      MUSIKE_CACHE_DIR: /cache
      MUSIKE_CACHE_MAX_MB: "2048"
      YTDLP_PATH: /data/ytdlp-wrap.sh
      YTDLP_DELAY: "4"
    restart: unless-stopped

volumes:
  musike-data:
  musike-cache:
